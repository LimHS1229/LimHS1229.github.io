<!--
Code for integrating CloudFlare's email protection with Hydejack's single page app loading.
-->
<script>
  document.getElementById('_pushState').addEventListener('hy-push-state-after', function (e) {
    function e(e){
      (console.error?console.error:console.log).call(console,e)
    }

    function t(e){
      return l.innerHTML='<a href="'+e.replace(/"/g,"&quot;")+'"></a>',l.childNodes[0].getAttribute("href")
    }

    function r(e,t){
      var r=e.substr(t,2);return parseInt(r,16)
    }

    function n(e,n){
      for(var o="",c=r(e,n),a=n+2;a<e.length;a+=2){
        var l=r(e,a)^c;
        o+=String.fromCharCode(l)
      }
      return t(o)
    }

    var o="/cdn-cgi/l/email-protection#",
        c=".__cf_email__",
        a="data-cfemail",
        l=document.createElement("div");

    !function(){
      for(var t=document.getElementsByTagName("a"),r=0;r<t.length;r++)
        try{
          var c=t[r],a=c.href.indexOf(o);
          a>-1&&(c.href="mailto:"+n(c.href,a+o.length))
        }catch(t){
          e(t)
        }
    }(),
    function(){
      for(var t=document.querySelectorAll(c),r=0;r<t.length;r++)
        try{
          var o=t[r],l=n(o.getAttribute(a),0),i=document.createTextNode(l);
          o.parentNode.replaceChild(i,o)
        }catch(t){
          e(t)
        }
    }()
  });
</script>

<script>
  (function () {
    var WRITE_BUTTON_ID = "write-post-btn";
    var WRITE_URL = "{{ '/write/' | relative_url }}";

    function findDarkModeToggle() {
      var directSelectors = [
        "#_dark-mode",
        ".dark-mode-toggle",
        "button[aria-label*='dark' i]",
        "a[aria-label*='dark' i]",
        "button[title*='dark' i]",
        "a[title*='dark' i]"
      ];

      for (var i = 0; i < directSelectors.length; i += 1) {
        var el = document.querySelector(directSelectors[i]);
        if (el) return el;
      }

      var iconNodes = document.querySelectorAll(".material-icons, .icon-moon, .icon-sun");
      for (var j = 0; j < iconNodes.length; j += 1) {
        var text = (iconNodes[j].textContent || "").toLowerCase();
        if (text.indexOf("brightness") > -1 || text.indexOf("dark") > -1 || text.indexOf("light") > -1) {
          var trigger = iconNodes[j].closest("button, a");
          if (trigger) return trigger;
        }
      }

      return null;
    }

    function buildWriteButton(wrapInListItem) {
      var link = document.createElement("a");
      link.id = WRITE_BUTTON_ID;
      link.href = WRITE_URL;
      link.className = "write-post-btn";
      link.setAttribute("aria-label", "글쓰기 페이지 열기");
      link.setAttribute("title", "글쓰기");
      link.innerHTML = '<span class="material-icons" aria-hidden="true">edit</span><span class="write-post-btn-text">글쓰기</span>';

      if (!wrapInListItem) return link;

      var li = document.createElement("li");
      li.className = "write-post-btn-item";
      li.appendChild(link);
      return li;
    }

    function ensureWriteButton() {
      if (document.getElementById(WRITE_BUTTON_ID)) return;

      var darkToggle = findDarkModeToggle();
      if (!darkToggle) return;

      var darkListItem = darkToggle.closest("li");
      if (darkListItem && darkListItem.parentElement && darkListItem.parentElement.tagName === "UL") {
        darkListItem.insertAdjacentElement("afterend", buildWriteButton(true));
        return;
      }

      darkToggle.insertAdjacentElement("afterend", buildWriteButton(false));
    }

    var pushStateEl = document.getElementById("_pushState");
    if (pushStateEl) {
      pushStateEl.addEventListener("hy-push-state-after", function () {
        setTimeout(ensureWriteButton, 50);
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      setTimeout(ensureWriteButton, 50);
    });
  })();
</script>

<!--
Example code for using Matamo as alternative analytics solution.
-->
{% if site.matomo_analytics %}
<script>
  var _paq = _paq || [];

  /*{% if site.matomo_analytics.no_cookies %}*/
  _paq.push(['disableCookies']);
  /*{% endif %}*/

  _paq.push(['trackPageView']);
  _paq.push(['enableLinkTracking']);
  _paq.push(['setTrackerUrl', u+'piwik.php']);
  _paq.push(['setSiteId', '{{site.matomo_analytics.site_id}}']);

  var pushStateEl = document.getElementById('_pushState');
  var timeStartLoadPage, referer, timeItTookToLoadPage;

  pushStateEl.addEventListener('hy-push-state-start', function() {
    timeStartLoadPage = new Date().getTime();
    referer = window.location.toString();
  });

  pushStateEl.addEventListener('hy-push-state-ready', function() {
    timeItTookToLoadPage = new Date().getTime() - timeStartLoadPage;
  });

  pushStateEl.addEventListener('hy-push-state-after', function() {
    _paq.push(['setReferrerUrl', referer]);
    _paq.push(['setCustomUrl', window.location.toString()]);
    _paq.push(['setDocumentTitle', document.title]);
    _paq.push(['deleteCustomVariables', 'page']);
    _paq.push(['setGenerationTimeMs', timeItTookToLoadPage]);
    _paq.push(['trackPageView']);
  });

  window.loadJSDeferred('{{site.matomo_analytics.root}}piwik.js');
</script>
{% endif %}
{% endcomment %}
