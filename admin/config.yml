backend:
  name: github
  repo: LimHS1229/LimHS1229.github.io
  branch: main

locale: "ko"
site_url: "https://limhs1229.github.io"
display_url: "https://limhs1229.github.io"
logo_url: "/assets/img/main_img2.JPG"

media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "posts"
    label: "Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{slug}}"
    editor:
      preview: true
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - label: "Image"
        name: "image"
        widget: "object"
        required: false
        fields:
          - { label: "Path", name: "path", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
